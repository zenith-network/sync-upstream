[package]
name = "sync-upstream"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/zenith-network/sync-upstream"
license = "MIT OR Apache-2.0"
description = "Synchronize vendored source trees from Git repositories"
publish = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
clap-cargo = "0.19.0"
colored = "3.1.1"
globset = "0.4.20"
serde = { version = "1.0.228", features = ["derive"] }
similar = "3.2.0"
slug = "0.1.6"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.4"
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"

[dev-dependencies]
duct = "1.1.2"
pretty_assertions = "1.4.1"
rstest = "0.27.0"
